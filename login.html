<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekko Paws 🐾</title>
    <link rel="icon" type="image/png" sizes="50x50" href="CET.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a3b5c;
            overflow: hidden;
            position: relative;
        }

        /* 🌸 Floating Background Elements Container */
        .cozy-bg-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatRandom {
            0% { transform: translateY(0vh) translateX(0vw) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-15vh) translateX(2vw) rotate(15deg); opacity: 1; }
            100% { transform: translateY(0vh) translateX(0vw) rotate(0deg); opacity: 0.6; }
        }

        .floating-item {
            position: absolute;
            font-size: 28px;
            animation: floatRandom 6s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .fi-1 { top: 10%; left: 15%; animation-duration: 5s; animation-delay: 0s; }
        .fi-2 { top: 75%; left: 10%; animation-duration: 7s; animation-delay: 1s; font-size: 34px; }
        .fi-3 { top: 20%; right: 12%; animation-duration: 6s; animation-delay: 2s; font-size: 32px; }
        .fi-4 { top: 80%; right: 18%; animation-duration: 8s; animation-delay: 1.5s; }
        .fi-5 { top: 45%; left: 5%; animation-duration: 6.5s; animation-delay: 3s; font-size: 24px; }
        .fi-6 { top: 50%; right: 8%; animation-duration: 7.5s; animation-delay: 0.5s; font-size: 30px; }
        .fi-7 { top: 5%; left: 45%; animation-duration: 5.5s; animation-delay: 2.5s; }
        .fi-8 { top: 90%; left: 50%; animation-duration: 6s; animation-delay: 1.8s; font-size: 26px; }

        /* 🐱 Peeping Cat Container */
        .peeping-cat-box {
            position: fixed;
            right: -30px;
            bottom: 0;
            z-index: 10;
            line-height: 0;
            cursor: pointer;
        }

        .peeping-cat-box lottie-player {
            display: block;
            margin-bottom: 0;
            margin-right: 0;
        }

        /* 💬 Larger, Roomier Speech Bubble */
        .cat-bubble {
            position: absolute;
            left: -220px; /* Adjusted left offset to accommodate larger width */
            bottom: 190px;
            background: white;
            color: #6c5ce7;
            padding: 12px 18px; /* Increased padding for a bigger box feel */
            border-radius: 16px;
            font-size: 13px; /* Slightly larger text */
            font-weight: 700;
            box-shadow: 0 6px 22px rgba(108, 92, 231, 0.22);
            border: 2px solid #f0e6ff;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .peeping-cat-box:hover .cat-bubble {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 380px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(162, 155, 254, 0.25);
            text-align: center;
            border: 2px solid #f0e6ff;
            z-index: 2;
            animation: cardAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .login-card h2 {
            color: #6c5ce7;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .login-card p.subtitle {
            color: #8c829e;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0d8ef;
            border-radius: 12px;
            font-size: 14px;
            background: #faf8ff;
            color: #4a3b5c;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #a29bfe;
            background: #fff;
            box-shadow: 0 0 8px rgba(162, 155, 254, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #a29bfe;
            color: white;
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.4);
        }

        .btn-primary:hover {
            background: #6c5ce7;
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.5);
        }

        .btn-success {
            background: #55efc4;
            color: #2d3436;
            box-shadow: 0 4px 15px rgba(85, 239, 196, 0.4);
        }

        .btn-success:hover {
            background: #00b894;
            color: white;
            box-shadow: 0 6px 18px rgba(0, 184, 148, 0.5);
        }

        #authError {
            color: #ff7675;
            font-size: 12px;
            margin-top: 15px;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- 🐾 Floating Background Cats & Flowers Wonderland -->
    <div class="cozy-bg-decorations">
        <div class="floating-item fi-1">🐱</div>
        <div class="floating-item fi-2">🌸</div>
        <div class="floating-item fi-3">🐾</div>
        <div class="floating-item fi-4">🌷</div>
        <div class="floating-item fi-5">😺</div>
        <div class="floating-item fi-6">🌸</div>
        <div class="floating-item fi-7">🌻</div>
        <div class="floating-item fi-8">🐾</div>
    </div>

    <!-- 🐱 Peeping Cat Animation with Larger Bubble -->
    <div class="peeping-cat-box">
        <div class="cat-bubble">Meow! Welcome to your cozy tracker! 🌸🐾</div>
        <lottie-player 
            src="https://lottie.host/b16a5894-5809-4c31-9584-15cd8a881669/MOCjBiK8i5.json" 
            background="transparent" 
            speed="1" 
            style="width: 220px; height: 220px;" 
            loop 
            autoplay>
        </lottie-player>
    </div>
    
    <!-- 🐾 Cozy OTP Verification Modal -->
    <div id="otpModal" class="modal-overlay" style="display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div class="card modal-card" style="text-align: center; position: relative; padding: 25px 20px; max-width: 320px;">
            <div style="font-size: 40px; margin-bottom: 8px;">💌🐾</div>
            <h3 style="color: var(--primary); margin-bottom: 8px;">Check Your Inbox!</h3>
            <p class="subtitle" style="margin-bottom: 15px; font-size: 13px;">We've sent a 6-digit cozy verification code to your email.</p>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="text" id="otpInput" class="form-control" placeholder="123456" maxlength="6" style="text-align: center; font-size: 20px; letter-spacing: 4px; font-weight: bold;">
            </div>

            <div class="modal-actions" style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="closeOtpModal()" style="flex: 1;">Cancel</button>
                <button class="btn btn-success" onclick="verifyOtpCode()" style="flex: 1;">Verify</button>
            </div>
        </div>
    </div>

    

    <!-- Central Login Card -->
    <div class="login-card">
        <div style="font-size: 46px; margin-bottom: 2px;"><img src="CET.png" alt="Nekko Paws" style="width: 70px; height: 70px; margin-left: 10px; vertical-align: middle;"></div>
        <h2>Nekko Paws</h2>
        <p class="subtitle">Sign in to sync your pastel ledger to the cloud.</p>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
            <button class="btn btn-success" onclick="handleSignup()">Create Account</button>
        </div>

        <p id="authError"></p>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
